<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA V Launcher</title>
  <style>
    :root {
      --bg: #050b08;
      --bg2: #111d16;
      --panel: rgba(12, 18, 15, 0.92);
      --panel-border: rgba(156, 224, 102, 0.26);
      --green: #a4e849;
      --green-strong: #86cf2e;
      --text: #edf5ed;
      --muted: #c6d5c2;
      --shadow: rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(164, 232, 73, 0.18), transparent 28%),
        linear-gradient(180deg, var(--bg2), var(--bg));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .launcher {
      position: relative;
      width: min(980px, 92vw);
      min-height: 620px;
      border: 1px solid var(--panel-border);
      background: linear-gradient(180deg, rgba(14, 20, 16, 0.84), rgba(7, 11, 9, 0.96));
      box-shadow: 0 30px 70px var(--shadow);
      padding: 42px 42px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .launcher::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 30%, rgba(0,0,0,0.14));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      text-align: center;
    }

    .tag {
      letter-spacing: 0.42rem;
      text-transform: uppercase;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 76px);
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 4px 34px rgba(164, 232, 73, 0.18);
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 620px;
      font-size: 18px;
      line-height: 1.7;
      color: var(--muted);
    }

    .actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(164, 232, 73, 0.38);
      background: var(--green);
      color: #0d170d;
      padding: 16px 30px;
      min-width: 220px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.18rem;
      font-weight: 700;
      font-size: 14px;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      box-shadow: 0 16px 26px rgba(97, 148, 44, 0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .meta {
      margin-top: 30px;
      font-size: 12px;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    .shoutout {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 10;
    }

    .shoutout[hidden] {
      display: none;
    }

    .popup {
      width: min(500px, 94vw);
      background: rgba(12, 18, 15, 0.96);
      border: 1px solid var(--panel-border);
      box-shadow: 0 24px 60px rgba(0,0,0,0.56);
      padding: 26px 24px 18px;
    }

    .popup-kicker {
      margin: 0 0 10px;
      letter-spacing: 0.18rem;
      text-transform: uppercase;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
    }

    .popup h2 {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.15;
      color: var(--text);
    }

    .popup p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 10px;
    }

    .popup a {
      color: var(--green);
      text-decoration: none;
    }

    .popup-close {
      width: 100%;
      margin-top: 14px;
      padding: 14px 18px;
      border: 1px solid rgba(164, 232, 73, 0.38);
      background: var(--green);
      color: #0d170d;
      letter-spacing: 0.18rem;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
    }

    .popup-close:disabled {
      opacity: 0.7;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="launcher" id="launcher-screen">
    <div class="content">
      <div class="tag">Launcher</div>
      <h1>GTA V</h1>
      <p class="subtitle">Web port start screen for a browser-based GTA V experience.</p>

      <div class="actions">
        <button class="btn" id="play-btn" type="button">Play</button>
      </div>

      <div class="meta">Browser / WebGPU / Local Preview</div>
    </div>
  </div>

  <div class="shoutout" id="shoutout" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="shoutout-title">
      <p class="popup-kicker">One-time message</p>
      <h2 id="shoutout-title">Shoutout to Revens</h2>
      <p>Big thanks to <strong>Revens</strong> for making this whole thing possible.</p>
      <p>They built and released the original port that this site runs.</p>
      <p>
        Source:<br>
        <a href="https://github.com/Revens" target="_blank" rel="noreferrer">github.com/Revens</a>
      </p>
      <button class="popup-close" id="shoutout-close" disabled>Close (10)</button>
    </div>
  </div>

  <script>
    (function () {
      var launcher = document.getElementById('launcher-screen');
      var playBtn = document.getElementById('play-btn');
      var shoutout = document.getElementById('shoutout');
      var closeBtn = document.getElementById('shoutout-close');

      function hideLauncher() {
        if (launcher) launcher.style.display = 'none';
      }

      function showShoutout() {
        if (!shoutout) return;
        shoutout.hidden = false;
        var wait = 10000;
        var start = Date.now();
        closeBtn.textContent = 'Close (10)';
        closeBtn.disabled = true;

        var timer = setInterval(function () {
          var left = Math.ceil((wait - (Date.now() - start)) / 1000);
          if (left <= 0) {
            clearInterval(timer);
            closeBtn.disabled = false;
            closeBtn.textContent = 'Close';
          } else {
            closeBtn.textContent = 'Close (' + left + ')';
          }
        }, 1000);

        closeBtn.onclick = function () {
          shoutout.hidden = true;
        };
      }

      if (playBtn) {
        playBtn.addEventListener('click', function () {
          hideLauncher();
          showShoutout();
        });
      }
    })();
  </script>
</body>
</html>
